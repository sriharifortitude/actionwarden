name: Triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        run: |
          echo "Thanks for opening: ${{ github.event.issue.title }}"
          echo "Body length: ${{ contains(github.event.issue.body, 'stack trace') }}"
      - name: Slash command
        if: ${{ github.event.comment.body }} == '/deploy'
        run: ./deploy.sh
